name: 🔎 Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: 🧪 Documentation and test suite
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 📦 Install developer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyyaml

      - name: 🧹 Lint maintenance utilities and tests
        run: ruff check scripts tests

      - name: 🧪 Run repository tests
        run: python -m pytest -q

      - name: 🔗 Validate project structure and Markdown links
        run: python scripts/validate_project.py

      - name: 📓 Validate notebook JSON
        run: python -m json.tool cervical-cancer-risk-data.ipynb > /dev/null

      - name: 🧾 Validate workflow YAML syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path(".github").rglob("*.yml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          for path in Path(".github").rglob("*.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print("GitHub workflow and issue/discussion YAML parsed successfully.")
          PY

# The health-related CSV is deliberately not loaded by CI. Local data audits
# are opt-in and should run only in an environment approved for the dataset.
